[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API งานและการแจ้งเตือน — ต้องมาก่อนกฎ index.html ด้านล่าง
[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

# แอปหน้าเดียว เปิด URL ไหนก็ส่ง index.html กลับ (ยกเว้นไฟล์จริงกับ /api ข้างบน)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
